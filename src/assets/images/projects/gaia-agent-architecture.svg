<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph GAIA research agent architecture</title>
  <desc id="desc">A task router directs incoming questions to research, calculation, attachment, or general workflows, which use bounded tools before producing a final answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f33"/>
      <stop offset="1" stop-color="#123d4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ad1df"/>
      <stop offset="1" stop-color="#8ae6ba"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06101b" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79dbe0"/>
    </marker>
  </defs>
  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="180" fill="#42b4c0" opacity=".08"/>
  <circle cx="120" cy="680" r="220" fill="#87e4ba" opacity=".06"/>
  <text x="72" y="86" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="34" font-weight="700">A bounded, routed research agent</text>
  <text x="72" y="124" fill="#a9c5ca" font-family="Arial, sans-serif" font-size="18">LangGraph orchestration · multimodal inputs · provider flexibility · regression tests</text>
  <g filter="url(#shadow)">
    <rect x="76" y="270" width="190" height="104" rx="24" fill="#f5f1e8"/>
    <text x="171" y="312" text-anchor="middle" fill="#142033" font-family="Arial, sans-serif" font-size="17" font-weight="700">INCOMING TASK</text>
    <text x="171" y="342" text-anchor="middle" fill="#526273" font-family="Arial, sans-serif" font-size="15">question + files</text>
    <rect x="363" y="244" width="218" height="156" rx="30" fill="url(#accent)"/>
    <text x="472" y="305" text-anchor="middle" fill="#0d2632" font-family="Arial, sans-serif" font-size="25" font-weight="700">TASK ROUTER</text>
    <text x="472" y="340" text-anchor="middle" fill="#174350" font-family="Arial, sans-serif" font-size="15">classify · constrain · dispatch</text>
    <rect x="684" y="168" width="180" height="82" rx="20" fill="#1f5261" stroke="#79dbe0" stroke-width="2"/>
    <rect x="908" y="168" width="180" height="82" rx="20" fill="#1f5261" stroke="#79dbe0" stroke-width="2"/>
    <rect x="684" y="292" width="180" height="82" rx="20" fill="#1f5261" stroke="#79dbe0" stroke-width="2"/>
    <rect x="908" y="292" width="180" height="82" rx="20" fill="#1f5261" stroke="#79dbe0" stroke-width="2"/>
    <text x="774" y="217" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="18" font-weight="700">RESEARCH</text>
    <text x="998" y="217" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="18" font-weight="700">CALCULATION</text>
    <text x="774" y="341" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="18" font-weight="700">ATTACHMENTS</text>
    <text x="998" y="341" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="18" font-weight="700">GENERAL</text>
    <rect x="685" y="482" width="404" height="94" rx="24" fill="#f5f1e8"/>
    <text x="887" y="521" text-anchor="middle" fill="#142033" font-family="Arial, sans-serif" font-size="20" font-weight="700">BOUNDED TOOL LOOP</text>
    <text x="887" y="550" text-anchor="middle" fill="#526273" font-family="Arial, sans-serif" font-size="15">search · documents · code · multimodal</text>
    <rect x="363" y="532" width="218" height="106" rx="24" fill="#173846" stroke="#8ae6ba" stroke-width="2"/>
    <text x="472" y="575" text-anchor="middle" fill="#f5f1e8" font-family="Arial, sans-serif" font-size="19" font-weight="700">VERIFIED ANSWER</text>
    <text x="472" y="604" text-anchor="middle" fill="#aad2d4" font-family="Arial, sans-serif" font-size="14">resumable evaluation</text>
  </g>
  <g fill="none" stroke="#79dbe0" stroke-width="4" marker-end="url(#arrow)">
    <path d="M266 322 H350"/>
    <path d="M581 286 C625 286 632 209 674 209"/>
    <path d="M581 306 C660 306 650 209 898 209"/>
    <path d="M581 338 C625 338 632 333 674 333"/>
    <path d="M581 358 C660 358 650 333 898 333"/>
    <path d="M774 250 V468"/>
    <path d="M998 250 V468"/>
    <path d="M774 374 V468"/>
    <path d="M998 374 V468"/>
    <path d="M685 529 C626 529 620 585 592 585"/>
  </g>
</svg>
